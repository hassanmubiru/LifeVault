name: lifevault_mobile
description: LifeVault - Secure personal document archive
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.0
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3
  file_selector: ^1.0.3
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.3
  uuid: ^4.2.1
  http: ^1.1.2
  shared_preferences: ^2.2.2
  permission_handler: ^11.1.0
  image_picker: ^1.0.4
  syncfusion_flutter_pdf: ^24.1.41
  google_mlkit_text_recognition: ^0.17.1
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true